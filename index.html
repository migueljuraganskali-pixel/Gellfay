<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web Downloader Suhu Digital - Otw SMK 2026">
    <title>Suhu Digital | Web Downloader</title>

    <style>
        /* 2. Tampilan Elegant & Dark Mode */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #334155;
            width: 85%;
            max-width: 400px;
        }

        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 24px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

        /* Style Input Link */
        input {
            width: 90%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #38bdf8;
            outline: none;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* Style Tombol */
        button {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        button:active { transform: scale(0.95); }

        /* Loading Bar Simple */
        #loadingBar {
            display: none;
            width: 100%;
            background-color: #334155;
            border-radius: 10px;
            margin-top: 15px;
        }

        #progress {
            width: 1%;
            height: 10px;
            background-color: #22c55e;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>SUHU DIGITAL</h1>
        <p>Sistem Deteksi & Downloader Video</p>
        
        <input type="text" id="linkVideo" placeholder="Tempel Link TikTok/YT di sini...">
        
        <button onclick="prosesDownload()">EKSEKUSI DOWNLOAD</button>

        <div id="loadingBar">
            <div id="progress"></div>
        </div>
        <p id="statusTxt" style="margin-top: 10px; font-size: 12px; color: #22c55e;"></p>
    </div>

    <script>
        /* 3. Logika Pintar (JavaScript) */
        function prosesDownload() {
            let link = document.getElementById("linkVideo").value.toLowerCase();
            let bar = document.getElementById("loadingBar");
            let progress = document.getElementById("progress");
            let status = document.getElementById("statusTxt");

            if (link === "") {
                alert("Masukkan link-nya dulu, bray!");
                return;
            }

            // Mulai Simulasi Loading
            bar.style.display = "block";
            status.innerText = "Menganalisis Link...";
            
            let width = 1;
            let interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    
                    // Deteksi Jenis Link setelah loading selesai
                    if (link.includes("youtube.com") || link.includes("youtu.be")) {
                        status.innerText = "✅ YouTube Terdeteksi! Siap Download.";
                    } else if (link.includes("tiktok.com")) {
                        status.innerText = "✅ TikTok Terdeteksi! Siap Download.";
                    } else {
                        status.innerText = "✅ Link " + link + " Berhasil Ditemukan!";
                    }
                    alert("Analisis Berhasil! Web Anda Siap Terhubung ke Google.");
                } else {
                    width++;
                    progress.style.width = width + "%";
                }
            }, 30); // Kecepatan loading
        }
    </script>

</body>
</html>
